name: Eaglercraft integration CI

on:
  push:
    branches: [meteor-client-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Build browser bundles
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser harness
        run: |
          node tools/serve.mjs 3000 . > /tmp/eaghacks-harness-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/eaghacks-harness-server.log
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null || {
            cat /tmp/eaghacks-harness-server.log
            exit 1
          }
          npm run test:browser

      - name: Package source snapshot
        run: |
          npm run package:source -- Eaglercraft-26.2-u1-Meteor-Source-CI.zip

      - name: Upload integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eaghacks-integration-build
          path: |
            dist/meteor.bundle.js
            dist/eaghacks-integration.js
            Eaglercraft-26.2-u1-Meteor-Source-CI.zip
          if-no-files-found: error
          retention-days: 14
